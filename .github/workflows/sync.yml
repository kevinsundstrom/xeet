# Pipeline 3 (PLAN.md §11): sync, on an upstream change, ten to twenty minutes.
#
# Skeleton with the real steps in place and the policy decisions called out.
# It is deliberately not fully automatic yet: steps 4 and 5 (re-run the oracle,
# compare) need the replica harness (`tools/oracle/replica*.mjs`) and the
# behavior canary, both still being built. Every step here is the seam it will
# plug into, and the two outcomes at the end (a bot pull request or a repair
# brief issue) are the shape PLAN.md §11 asks for.
#
# Triggered by upstream-watch.yml, or by hand.
name: sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step but do not open a pull request or an issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  # X's assets live in the private store; `secrets` is not available in a
  # job-level `if`, so availability is decided here and passed on as an output.
  # A missing secret skips the asset-dependent job with a notice, never a red run.
  vendor:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.XEET_VENDOR_URL }}
          TOKEN: ${{ secrets.XEET_VENDOR_TOKEN }}
        run: |
          if [ -n "$URL" ] && [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Upstream assets not configured::XEET_VENDOR_URL and XEET_VENDOR_TOKEN are unset, so the jobs that build \`xeet-core\` are skipped. docs/CI.md says what the secrets enable."
            {
              echo "### Upstream assets not configured"
              echo ""
              echo "\`XEET_VENDOR_URL\` and \`XEET_VENDOR_TOKEN\` are unset, so the jobs that build \`xeet-core\` were skipped. See docs/CI.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sync:
    needs: vendor
    if: needs.vendor.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # --- 1. Snapshot ------------------------------------------------------
      # Downloads the stylesheet, client code, fonts, sprite, and the canary
      # set of ~200 public posts; writes assets/upstream.lock.json.
      - name: Snapshot upstream
        run: node tools/sync-upstream.mjs
      - name: Upload the snapshot to the private store
        env:
          XEET_VENDOR_PUT_URL: ${{ secrets.XEET_VENDOR_PUT_URL }}
          XEET_VENDOR_PUT_TOKEN: ${{ secrets.XEET_VENDOR_PUT_TOKEN }}
        run: |
          # The store is content-addressed (docs/CI.md). The upload is a
          # separate credential than the download one; it never runs on a fork.
          if [ -z "$XEET_VENDOR_PUT_URL" ]; then
            echo "::error::no store configured for upload (XEET_VENDOR_PUT_URL); see docs/CI.md"
            exit 1
          fi
          node tools/ship/publish-vendor.mjs

      # --- 2. Extract -------------------------------------------------------
      - name: Regenerate tokens and component skeletons
        run: |
          node tools/extract-tokens.mjs
          node tools/oracle/replica-fixtures.mjs

      # --- 3. Fingerprint ---------------------------------------------------
      # Most X deploys touch nothing we depend on. If the extracted results are
      # byte-identical, record the new app version as equivalent and stop.
      - name: Fingerprint the extracted results
        id: fingerprint
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, existsSync } = require("node:fs");
            const h = createHash("sha256");
            for (const f of ["crates/xeet-core/src/tokens.rs", "assets/upstream.lock.json"]) {
              if (existsSync(f)) { h.update(f); h.update(readFileSync(f)); }
            }
            console.log("fingerprint=" + h.digest("hex").slice(0, 16));
          ' | tee "$GITHUB_OUTPUT"
          if [ "$(git status --porcelain crates/xeet-core/src/tokens.rs | wc -l)" -eq 0 ] && [ "$(git status --porcelain assets/upstream.lock.json | wc -l)" -eq 0 ]; then
            echo "equivalent=true" >> "$GITHUB_OUTPUT"
            echo "nothing we depend on changed; recording the app version as equivalent"
          else
            echo "equivalent=false" >> "$GITHUB_OUTPUT"
          fi

      # --- 4. Re-run the oracle --------------------------------------------
      # TODO(sync): needs the replica harness. Until it lands, this step only
      # re-captures the canary set and stamps what it can.
      - name: Re-run the oracle
        if: steps.fingerprint.outputs.equivalent == 'false'
        run: |
          echo "::notice::oracle re-capture is wired once tools/oracle/replica*.mjs lands"
          # node tools/oracle/replica.mjs --corpus corpus/ --save tests/golden/raster

      # --- 5. Compare -------------------------------------------------------
      - name: Gates
        id: gates
        if: steps.fingerprint.outputs.equivalent == 'false'
        continue-on-error: true
        env:
          XEET_VENDOR_URL: ${{ secrets.XEET_VENDOR_URL }}
          XEET_VENDOR_TOKEN: ${{ secrets.XEET_VENDOR_TOKEN }}
        run: |
          node tools/ship/fetch-vendor.mjs
          cargo build --release --bin xeet
          XEET_BIN="$PWD/target/release/xeet" node tools/ship/parity-check.mjs
          cargo test --workspace

      # --- 6. Act -----------------------------------------------------------
      - name: Open a token port (a value moved, nothing structural)
        if: steps.fingerprint.outputs.equivalent == 'false' && steps.gates.outcome == 'success' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="sync/upstream-$(date -u +%Y%m%d%H%M)"
          git config user.name "xeet bot"
          git config user.email "bot@xeet.invalid"
          git checkout -b "$branch"
          git add -A crates/xeet-core/src/tokens.rs assets/upstream.lock.json
          git commit -m "tokens: follow upstream $(node -p 'require("./assets/upstream.lock.json").appVersion' | cut -c1-8)"
          git push -u origin "$branch"
          gh pr create --title "Follow upstream X token changes" \
            --body "Regenerated from the snapshot in the private store. Gates: $(node -p '1' >/dev/null && echo pass). A person reviews the token diff; the run with every step's output is $RUN_URL."

      - name: Open a repair brief (a rule or structure changed)
        if: steps.fingerprint.outputs.equivalent == 'false' && steps.gates.outcome == 'failure' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Repair brief: upstream X changed something we model" \
            --body-file - <<'BODY'
          A sync run failed its gates. This issue is the brief an agent picks up.

          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Upstream app version:** the one in `assets/upstream.lock.json`
          - **What changed:** the token diff is in the run log (`git diff` after extraction)
          - **What failed:** the gate output is at the bottom of the failing step

          To reproduce:

          ```
          node tools/ship/fetch-vendor.mjs
          cargo build --release --bin xeet
          XEET_BIN=target/release/xeet node tools/ship/parity-check.mjs
          cargo test --workspace
          ```

          Fix the code, not the goldens: a golden may only change through
          `node tools/ship/golden-stamp.mjs --write` after an oracle run, and CI
          rejects a golden whose stamp does not match (`tools/ship/golden-stamp.mjs --check`).
          BODY
