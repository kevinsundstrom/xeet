[package]
name = "xeet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Browserless renderer for X post previews: rules, text layout, paint."
build = "build.rs"

[dependencies]
xeet-text = { path = "../xeet-text" }
harfrust = "0.15"
skrifa = "0.49"
icu_segmenter = "2.4"
unicode-bidi = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
zune-jpeg = { version = "0.5.16-rc3", default-features = false, features = ["std"] }
# Native lazy font packs verify the SHA-256 the build wrote into packs.json.
# Pure Rust, so the wasm build compiles it too (the dead branch is dropped).
sha2 = "0.10"
image-webp = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
icu_properties = "2"

[build-dependencies]
serde_json = "1"
