[package]
name = "xeet-wasm"
description = "WebAssembly bindings for xeet-core and xeet-resolve."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xeet-core = { path = "../xeet-core" }
xeet-resolve = { path = "../xeet-resolve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The JS boundary. The CLI's version must match this one exactly; both are
# pinned to 0.2.130 in tools/ship/build-wasm.mjs.
wasm-bindgen = "=0.2.130"
# `resolve` awaits the host's promises, so it needs the futures glue; `js-sys`
# is the object/array/Promise surface (`web-sys` is deliberately absent: the
# host contract is plain objects, so there is no DOM to touch).
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
